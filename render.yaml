services:
  # Web Dashboard & Shared Resumption Viewer Service
  - type: web
    name: remind-dashboard
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18.18.0

  # Optional Cloud API Daemon / Team Handoff Viewer
  - type: web
    name: remind-daemon
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./handoffs.db
      - key: AUTO_GENERATE_SCHEDULE
        value: "false"
