services:
  # Web Dashboard & Shared Resumption Viewer Service
  - type: web
    name: remind-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Optional Cloud API Daemon / Team Handoff Viewer
  - type: web
    name: remind-daemon
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./handoffs.db
      - key: AUTO_GENERATE_SCHEDULE
        value: "false"
